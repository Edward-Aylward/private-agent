name: Private rebrand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-Private-with-private:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Private/Private references with Private
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path(".")
          SKIP_DIRS = {
              ".git",
              "node_modules",
              ".next",
              ".turbo",
              ".venv",
              "venv",
              "dist",
              "build",
              "__pycache__",
          }

          pattern = re.compile("Private", re.IGNORECASE)

          def should_skip(path: Path) -> bool:
              return any(part in SKIP_DIRS for part in path.parts)

          def is_binary(path: Path) -> bool:
              try:
                  data = path.read_bytes()[:8192]
              except OSError:
                  return True
              return b"\0" in data

          changed_files = 0
          renamed_paths = 0

          for path in sorted(ROOT.rglob("*")):
              if not path.is_file() or should_skip(path):
                  continue
              if is_binary(path):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              replaced = pattern.sub("Private", text)
              if replaced != text:
                  path.write_text(replaced, encoding="utf-8")
                  changed_files += 1

          rename_candidates = [
              path for path in ROOT.rglob("*")
              if not should_skip(path) and pattern.search(path.name)
          ]
          rename_candidates.sort(key=lambda p: len(p.parts), reverse=True)

          for path in rename_candidates:
              if not path.exists():
                  continue
              target = path.with_name(pattern.sub("Private", path.name))
              if target.exists():
                  raise RuntimeError(f"Cannot rename {path} -> {target}: target already exists")
              path.rename(target)
              renamed_paths += 1

          print(f"Changed text files: {changed_files}")
          print(f"Renamed paths: {renamed_paths}")
          PY

          git status --short

          if git diff --quiet && git diff --cached --quiet; then
            echo "No Private/Private references found to replace."
            exit 0
          fi

          git add -A
          git commit -m "Replace Private references with Private"
          git push